# App ID uses the github org/user placeholder `wijitify`.
# Update to io.github.<user>.Wijitify when the public repo owner is known.
app-id: io.github.JordHV.Wijitify
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: wijitify
# Freeze these permissions: the Flatpak portal refuses in-app updates that expand them.
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --share=ipc
  - --filesystem=xdg-config/wijitify:create
  - --filesystem=xdg-cache/wijitify:create
modules:
  # Wayland clipboard tools for GNOME/Flatpak (no wlr-data-control). finish-args unchanged.
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb
  - name: wijitify
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/wijitify/cargo
        RUST_BACKTRACE: "1"
    build-commands:
      - python3 packaging/flatpak/apply-vendor-patches.py
      - cargo --offline build --release --locked
      - install -Dm755 target/release/wijitify /app/bin/wijitify
      - install -Dm644 packaging/flatpak/io.github.JordHV.Wijitify.desktop /app/share/applications/io.github.JordHV.Wijitify.desktop
      - install -Dm644 packaging/flatpak/io.github.JordHV.Wijitify.svg /app/share/icons/hicolor/scalable/apps/io.github.JordHV.Wijitify.svg
      - install -Dm644 packaging/flatpak/io.github.JordHV.Wijitify.svg /app/share/icons/hicolor/scalable/apps/io.github.JordHV.Wijitify.svg
      - install -Dm644 packaging/flatpak/io.github.JordHV.Wijitify.metainfo.xml /app/share/metainfo/io.github.JordHV.Wijitify.metainfo.xml
    sources:
      - cargo-sources.json
      - type: dir
        path: ../..
